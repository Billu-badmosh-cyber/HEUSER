<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { font-size: 5rem; color: #38bdf8; margin: 0; }
    p { color: #94a3b8; margin: 12px 0 24px; font-size: 1.1rem; }
    a {
      text-decoration: none;
      background: #38bdf8;
      color: #0f172a;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! This page does not exist on this server.</p>
  <a href="/">Go Back Home</a>
</body>
</html>
