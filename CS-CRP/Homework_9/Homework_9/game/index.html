<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      text-decoration: none;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    h1 { font-size: 1.6rem; }
    #status { margin-bottom: 18px; font-size: 1.15rem; color: #cbd5e1; min-height: 28px; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      margin-bottom: 24px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      font-size: 2.5rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .cell:hover { background: #334155; transform: scale(1.03); }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f472b6; }
    button#restart {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button#restart:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>🎮 Tic-Tac-Toe</h1>
    <a class="back-btn" href="/">← Home</a>
  </div>
  <div id="status">Your turn (X)</div>
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <button id="restart">Restart Game</button>
  <script>
    const cells = document.querySelectorAll(".cell");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");
    let board = Array(9).fill("");
    let gameOver = false;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function checkWinner(p) { return wins.some(c => c.every(i => board[i] === p)); }
    function computerMove() {
      const empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
      if (empty.length === 0 || gameOver) return;
      const choice = empty[Math.floor(Math.random() * empty.length)];
      board[choice] = "O";
      cells[choice].textContent = "O";
      cells[choice].classList.add("o");
      if (checkWinner("O")) { statusEl.textContent = "🤖 Computer wins!"; gameOver = true; }
      else if (!board.includes("")) { statusEl.textContent = "🤝 It's a draw!"; gameOver = true; }
      else { statusEl.textContent = "Your turn (X)"; }
    }
    cells.forEach(cell => {
      cell.addEventListener("click", () => {
        const i = cell.dataset.index;
        if (board[i] !== "" || gameOver) return;
        board[i] = "X";
        cell.textContent = "X";
        cell.classList.add("x");
        if (checkWinner("X")) { statusEl.textContent = "🎉 You win!"; gameOver = true; }
        else if (!board.includes("")) { statusEl.textContent = "🤝 It's a draw!"; gameOver = true; }
        else { statusEl.textContent = "Computer is thinking..."; setTimeout(computerMove, 350); }
      });
    });
    restartBtn.addEventListener("click", () => {
      board = Array(9).fill("");
      gameOver = false;
      statusEl.textContent = "Your turn (X)";
      cells.forEach(c => { c.textContent = ""; c.classList.remove("x", "o"); });
    });
  </script>
</body>
</html>
